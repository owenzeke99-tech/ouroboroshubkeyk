<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ouroboros Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --pink:#ff8acb;
    --pink-light:#ffc1e5;
    --pink-soft:#ffacd9;
    --pink-dark:#d96da9;
    --bg:#050305;
}

/* =========================
   BODY
========================= */

body{
    min-height:100vh;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-family:"Orbitron",sans-serif;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,138,203,.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(255,138,203,.06),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(255,172,217,.05),
            transparent 35%
        ),
        var(--bg);
}


/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.grid{
    position:absolute;
    inset:-50%;

    opacity:.055;

    background-image:
        linear-gradient(
            rgba(255,172,217,.4) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,172,217,.4) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(62deg)
        translateY(100px)
        scale(1.4);

    animation:gridMove 10s linear infinite;
}

@keyframes gridMove{

    from{
        transform:
            perspective(500px)
            rotateX(62deg)
            translateY(80px)
            scale(1.4);
    }

    to{
        transform:
            perspective(500px)
            rotateX(62deg)
            translateY(145px)
            scale(1.4);
    }
}


.big-glow{
    position:absolute;

    width:600px;
    height:600px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,138,203,.08),
            transparent 65%
        );

    filter:blur(30px);

    animation:bigGlow 5s ease-in-out infinite;
}

@keyframes bigGlow{

    0%,100%{
        opacity:.4;
        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    50%{
        opacity:.8;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}


/* =========================
   PARTICLES
========================= */

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:var(--pink-soft);

    box-shadow:
        0 0 6px rgba(255,172,217,.7),
        0 0 13px rgba(255,138,203,.35);

    animation:particleFloat linear infinite;
}

@keyframes particleFloat{

    0%{
        transform:
            translateY(110vh)
            scale(.4);

        opacity:0;
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.7;
    }

    100%{
        transform:
            translateY(-10vh)
            scale(1.2);

        opacity:0;
    }
}


/* =========================
   CARD
========================= */

.wrapper{
    position:relative;
    z-index:5;

    width:min(470px,92vw);

    animation:cardIn .9s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


.card{
    position:relative;

    padding:38px 32px 30px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,172,217,.035),
            rgba(8,5,8,.93)
        );

    border:
        1px solid rgba(255,172,217,.16);

    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        0 0 50px rgba(255,138,203,.055),
        inset 0 0 35px rgba(255,172,217,.015);

    overflow:hidden;
}


/* moving top line */

.card::before{
    content:"";

    position:absolute;

    top:0;
    left:-35%;

    width:35%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--pink-soft),
            white,
            var(--pink-soft),
            transparent
        );

    box-shadow:
        0 0 8px rgba(255,172,217,.6);

    animation:topLine 4s linear infinite;
}

@keyframes topLine{

    from{
        left:-35%;
    }

    to{
        left:140%;
    }
}


/* =========================
   LOGO
========================= */

.logo-area{
    position:relative;

    width:150px;
    height:150px;

    margin:0 auto 17px;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* Outer circle */

.logo-circle{
    position:absolute;

    width:142px;
    height:142px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,172,217,.28);

    box-shadow:
        0 0 20px rgba(255,138,203,.08),
        inset 0 0 20px rgba(255,138,203,.04);

    animation:
        rotateCircle 12s linear infinite;
}

.logo-circle::before{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    top:8px;
    left:50%;

    border-radius:50%;

    background:#ffc1e5;

    box-shadow:
        0 0 8px #ffacd9,
        0 0 18px rgba(255,172,217,.6);
}

.logo-circle::after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    bottom:15px;
    right:16px;

    border-radius:50%;

    background:#ff8acb;

    box-shadow:
        0 0 8px rgba(255,138,203,.7);
}

@keyframes rotateCircle{

    to{
        transform:rotate(360deg);
    }
}


/* Inner ring */

.logo-inner-ring{
    position:absolute;

    width:115px;
    height:115px;

    border-radius:50%;

    border:
        1px dashed
        rgba(255,193,229,.28);

    animation:
        rotateReverse 9s linear infinite;
}

@keyframes rotateReverse{

    to{
        transform:rotate(-360deg);
    }
}


/* Elegant O */

.logo{

    position:relative;

    z-index:5;

    width:92px;
    height:92px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,193,229,.08),
            rgba(255,138,203,.025) 60%,
            transparent 70%
        );

    border:
        1px solid
        rgba(255,193,229,.25);

    box-shadow:
        0 0 20px rgba(255,138,203,.12),
        inset 0 0 25px rgba(255,138,203,.04);

    animation:
        logoFloat 3.5s ease-in-out infinite;
}


/* Actual O */

.logo span{

    position:relative;

    display:block;

    font-family:"Orbitron",sans-serif;

    font-size:64px;

    line-height:1;

    font-weight:900;

    color:transparent;

    -webkit-text-stroke:
        3px var(--pink-light);

    text-shadow:
        0 0 8px rgba(255,193,229,.55),
        0 0 20px rgba(255,138,203,.3),
        0 0 40px rgba(255,138,203,.12);

    animation:
        letterGlow 2.8s ease-in-out infinite alternate;
}


/* Small highlight inside O */

.logo span::after{

    content:"";

    position:absolute;

    width:11px;
    height:11px;

    top:5px;
    right:2px;

    border-radius:50%;

    background:#ffe5f3;

    box-shadow:
        0 0 10px #ffc1e5,
        0 0 20px rgba(255,172,217,.6);

    animation:highlight 2s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}

@keyframes letterGlow{

    from{
        filter:brightness(.9);
    }

    to{
        filter:brightness(1.25);
    }
}

@keyframes highlight{

    0%,100%{
        opacity:.35;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================
   TITLE
========================= */

.title{
    text-align:center;

    font-size:27px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:8px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffc1e5,
            #fff,
            #ffacd9,
            #fff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleMove 5s linear infinite;
}

@keyframes titleMove{

    to{
        background-position:250% center;
    }
}

.subtitle{
    text-align:center;

    color:#806d78;

    font-family:Arial,sans-serif;

    font-size:12px;

    margin-bottom:25px;
}


/* =========================
   KEY
========================= */

.key-label{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:9px;

    color:#bfa2b2;

    font-size:10px;

    font-weight:800;

    letter-spacing:1.2px;
}

.key-status{
    display:flex;

    align-items:center;

    gap:6px;

    color:#6cffaa;

    font-size:9px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#6cffaa;

    box-shadow:
        0 0 7px #6cffaa;

    animation:statusPulse 1.5s infinite;
}

@keyframes statusPulse{

    0%,100%{
        opacity:.4;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.15);
    }
}


.key-box{

    position:relative;

    width:100%;

    min-height:68px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px 17px;

    border-radius:15px;

    background:
        rgba(0,0,0,.38);

    border:
        1px solid
        rgba(255,172,217,.18);

    box-shadow:
        inset 0 0 25px rgba(255,138,203,.025);

    margin-bottom:14px;
}

.key-text{

    width:100%;

    color:#ffe4f2;

    font-family:Arial,sans-serif;

    font-size:13px;

    font-weight:700;

    line-height:1.5;

    word-break:break-all;

    text-align:center;

    text-shadow:
        0 0 9px rgba(255,172,217,.25);
}


/* =========================
   COPY BUTTON
========================= */

.copy-btn{

    position:relative;

    width:100%;
    height:56px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    overflow:hidden;

    color:#fff;

    font-family:"Orbitron",sans-serif;

    font-size:12px;

    font-weight:900;

    letter-spacing:1.5px;

    background:
        linear-gradient(
            135deg,
            #ffacd9,
            #ed83bb,
            #c9659d
        );

    box-shadow:
        0 9px 25px rgba(255,138,203,.12);

    transition:.25s;
}

.copy-btn span{
    position:relative;
    z-index:2;
}

.copy-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:60%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:skewX(-20deg);

    animation:buttonShine 4s infinite;
}

@keyframes buttonShine{

    0%{
        left:-100%;
    }

    45%,100%{
        left:140%;
    }
}

.copy-btn:hover{

    transform:translateY(-3px);

    box-shadow:
        0 14px 35px rgba(255,138,203,.2),
        0 0 20px rgba(255,172,217,.12);
}

.copy-btn:active{
    transform:scale(.98);
}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:20px;

    margin-top:13px;

    text-align:center;

    font-family:Arial,sans-serif;

    font-size:12px;

    font-weight:700;
}

.success{

    color:#6cffaa;

    text-shadow:
        0 0 10px rgba(108,255,170,.35);
}

.error{

    color:#ff8acb;

    text-shadow:
        0 0 10px rgba(255,138,203,.3);
}


/* =========================
   FOOTER
========================= */

.footer{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    margin-top:19px;

    padding-top:18px;

    border-top:
        1px solid
        rgba(255,172,217,.08);

    color:#5f5159;

    font-family:Arial,sans-serif;

    font-size:10px;
}

.footer-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ffacd9;

    box-shadow:
        0 0 7px rgba(255,172,217,.7);

    animation:statusPulse 1.5s infinite;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .card{
        padding:31px 21px 25px;
        border-radius:23px;
    }

    .logo-area{
        transform:scale(.88);
        margin-top:-6px;
        margin-bottom:10px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:11px;
    }

    .key-text{
        font-size:12px;
    }
}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="background">

    <div class="grid"></div>

    <div class="big-glow"></div>


    <span class="particle"
          style="left:4%;animation-duration:10s;animation-delay:0s"></span>

    <span class="particle"
          style="left:12%;animation-duration:13s;animation-delay:2s"></span>

    <span class="particle"
          style="left:23%;animation-duration:9s;animation-delay:1s"></span>

    <span class="particle"
          style="left:34%;animation-duration:14s;animation-delay:4s"></span>

    <span class="particle"
          style="left:46%;animation-duration:11s;animation-delay:2s"></span>

    <span class="particle"
          style="left:58%;animation-duration:15s;animation-delay:5s"></span>

    <span class="particle"
          style="left:69%;animation-duration:10s;animation-delay:3s"></span>

    <span class="particle"
          style="left:80%;animation-duration:13s;animation-delay:1s"></span>

    <span class="particle"
          style="left:91%;animation-duration:11s;animation-delay:4s"></span>

</div>


<!-- MAIN -->

<div class="wrapper">

    <div class="card">


        <!-- LOGO -->

        <div class="logo-area">

            <div class="logo-circle"></div>

            <div class="logo-inner-ring"></div>

            <div class="logo">

                <span>O</span>

            </div>

        </div>


        <!-- TITLE -->

        <h1 class="title">
            Ouroboros Hub Key
        </h1>

        <p class="subtitle">
            Your access key is ready
        </p>


        <!-- KEY -->

        <div class="key-label">

            <span>YOUR ACCESS KEY</span>

            <span class="key-status">

                <i class="status-dot"></i>

                ACTIVE

            </span>

        </div>


        <div class="key-box">

            <div class="key-text" id="keyText">
                OuroborosHubKeyNalwkwj - Lappqjwnlaiowpje
            </div>

        </div>


        <!-- COPY -->

        <button
            class="copy-btn"
            id="copyButton"
            onclick="copyKey()"
        >

            <span id="buttonText">
                COPY KEY
            </span>

        </button>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
        ></div>


        <!-- FOOTER -->

        <div class="footer">

            <span class="footer-dot"></span>

            <span>
                Ouroboros Hub Secure Key System
            </span>

        </div>

    </div>

</div>


<script>

/* =========================
   YOUR KEY
========================= */

const key =
"OuroborosHubKeyNalwkwj - Lappqjwnlaiowpje";


/* =========================
   COPY KEY
========================= */

function copyKey(){

    const message =
        document.getElementById("message");

    const buttonText =
        document.getElementById("buttonText");


    navigator.clipboard.writeText(key)

    .then(function(){

        buttonText.innerText =
            "✓ KEY COPIED";

        message.className =
            "message success";

        message.innerText =
            "Key copied successfully!";


        setTimeout(function(){

            buttonText.innerText =
                "COPY KEY";

            message.innerText =
                "";

            message.className =
                "message";

        },2200);

    })

    .catch(function(){

        message.className =
            "message error";

        message.innerText =
            "Copy failed. Please copy manually.";

    });

}

</script>

</body>
</html>
